<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link href="/logo.webp" rel="icon" type="image/webp"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HorizonHub</title>
    <script>
        fetch('/edit_me.json')
            .then(response => response.json())
            .then(data => 
            {
                document.documentElement.style.backgroundColor = data.theme.colors.background;
                document.body.style.backgroundColor = data.theme.colors.background;
                document.getElementById('root').style.backgroundColor = data.theme.colors.background;
            });
    </script>
    <style>
        html, body, #root 
        {
            margin: 0;
            padding: 0;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
